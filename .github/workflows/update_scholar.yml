name: Update Google Scholar Citations

on:
  schedule:
    # Roda todo domingo às 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Permite que você rode o script manualmente com um botão no GitHub

jobs:
  update-citations:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessário para fazer o commit de volta no repo
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scholarly beautifulsoup4

      - name: Run update script
        run: python src/update_scholar.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update Google Scholar citations"
          file_pattern: "index.html"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
